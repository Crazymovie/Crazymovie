<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Details - Crazymovie</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<!-- ========================================
        MOVIE HERO BANNER
======================================== -->

<section class="movie-hero">

    <img
        id="heroBanner"
        src=""
        alt="Movie Banner">

    <div class="hero-overlay"></div>

</section>

<div class="logo">
🎬 Crazymovie
</div>

<nav>

<a href="index.html">Home</a>

<a href="#">Movies</a>

<a href="#">Trending</a>

</nav>

</header>

<section class="movie-details">

<!-- ========================================
        TOP AD
======================================== -->

<div class="top-ad">

    Top Advertisement

</div>

<div class="movie-container">

<div class="movie-poster">

<img id="moviePoster" src="" alt="Movie Poster">

</div>

<div class="movie-content">

<h1 id="movieTitle">

    Loading...

</h1>

<div class="movie-info-row">

    <span>

        ⭐ IMDb:
        <strong id="movieRating">0.0</strong>

    </span>

    <span>

        📅
        <strong id="movieYear">2025</strong>

    </span>

    <span>

        🎭
        <strong id="movieGenre">Action</strong>

    </span>

</div>

<div class="movie-info-row">

    <span>

        🌎
        <strong id="movieLanguage">English</strong>

    </span>

    <span>

        🎞️
        <strong id="movieQuality">HD</strong>

    </span>

    <span>

        ⏱️
        <strong id="movieDuration">2h 00m</strong>

    </span>

</div>

<p id="movieDescription">

    Loading Description...

</p>

<div class="movie-action-buttons">

<!-- ========================================
        MIDDLE AD
======================================== -->

<div class="middle-ad">

    Middle Advertisement

</div>

    <button id="watchButton"
        class="watch-btn">

        ▶ Watch Now

    </button>

    <button id="downloadButton"
        class="download-btn">

        ⬇ Download

    </button>

</div>

</div>

</div>

<!-- ========================================
        SCREENSHOT GALLERY
======================================== -->

<div class="screenshots-section">

    <h2>

        📸 Screenshots

    </h2>

    <div class="screenshots-grid">

        <img id="screenshot1"
            src=""
            alt="Screenshot 1">

        <img id="screenshot2"
            src=""
            alt="Screenshot 2">

        <img id="screenshot3"
            src=""
            alt="Screenshot 3">

        <img id="screenshot4"
            src=""
            alt="Screenshot 4">

    </div>

</div>

<!-- ========================================
        RELATED MOVIES
======================================== -->

<div class="related-movies-section">

<!-- ========================================
        BOTTOM AD
======================================== -->

<div class="bottom-ad">

    Bottom Advertisement

</div>

    <h2>

        🎬 Related Movies

    </h2>

    <div id="relatedMoviesGrid"
        class="related-movies-grid">

        <!-- movie.js automatically load -->

    </div>

</div>

</section>

<script type="module" src="movie.js"></script>

</body>

</html>
