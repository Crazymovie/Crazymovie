<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crazymovie</title>

<link rel="stylesheet" href="style.css">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header>

    <div class="logo">
        🎬 Crazymovie
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="#">
            Movies
        </a>

        <a href="#">
            TV Series
        </a>

        <a href="#">
            Trending
        </a>

        <a href="#">
            Contact
        </a>

    </nav>

</header>



<!-- ========================================
     HERO
======================================== -->

<section class="hero">

    <div class="hero-content">

        <span class="hero-badge">
            🔥 #1 Trending Movie
        </span>


        <h1>
            Download Amazing Movies
        </h1>


        <p>
            Discover your favorite movies and
            download them in high quality.
        </p>


    </div>

</section>



<!-- ========================================
     MOVIES
======================================== -->

<section class="movies">


    <h2>
        🔥 Trending Movies
    </h2>



    <!-- SEARCH + FILTER -->

    <div class="search-box">


        <div class="filter-container">


            <select id="genreFilter">

                <option value="all">
                    All Genres
                </option>

                <option value="action">
                    Action
                </option>

                <option value="comedy">
                    Comedy
                </option>

                <option value="horror">
                    Horror
                </option>

                <option value="romance">
                    Romance
                </option>

                <option value="sci-fi">
                    Sci-Fi
                </option>

            </select>



            <select id="yearFilter">

                <option value="all">
                    All Years
                </option>

            </select>


        </div>



        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search movies..."
            onkeyup="searchMovies()"
        >


    </div>



    <!-- ========================================
         CATEGORY BUTTONS
    ======================================== -->

    <div class="category-buttons">


        <button onclick="filterMovies('All')">
            🎬 All
        </button>


        <button onclick="filterMovies('Action')">
            ⚡ Action
        </button>


        <button onclick="filterMovies('Adventure')">
            🗺️ Adventure
        </button>


        <button onclick="filterMovies('Sci-Fi')">
            🚀 Sci-Fi
        </button>


        <button onclick="filterMovies('Drama')">
            🎭 Drama
        </button>


        <button onclick="filterMovies('Romance')">
            ❤️ Romance
        </button>


    </div>



    <!-- ========================================
         ADMIN PUBLISHED MOVIES
    ======================================== -->

    <div
        id="dynamicMovies"
        class="movie-grid"
    >
    </div>


</section>



<!-- ========================================
     SCRIPT
======================================== -->

<script
    type="module"
    src="script.js"
></script>


</body>

</html>
