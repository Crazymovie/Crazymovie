<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Details - Crazymovie</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>


<div class="logo">
🎬 Crazymovie
</div>

<nav>

<a href="index.html">Home</a>

<a href="#">Movies</a>

<a href="#">Trending</a>

</nav>

</header>


<section class="movie-details">

<!-- ========================================
        TOP AD
======================================== -->

<div class="top-ad">

    Top Advertisement

</div>


<div class="movie-container">

<div class="movie-poster">

<img id="moviePoster" src="" alt="Movie Poster">

</div>


<div class="movie-content">

<h1 id="movieTitle">

    Loading...

</h1>


<div class="movie-info-row">

    <span>

        ⭐ IMDb:
        <strong id="movieRating">0.0</strong>

    </span>

    <span>

        📅
        <strong id="movieYear">2025</strong>

    </span>

    <span>

        🎭
        <strong id="movieGenre">Action</strong>

    </span>

</div>


<div class="movie-info-row">

    <span>

        🌎
        <strong id="movieLanguage">English</strong>

    </span>

    <span>

        🎞️
        <strong id="movieQuality">HD</strong>

    </span>

    <span>

        ⏱️
        <strong id="movieDuration">2h 00m</strong>

    </span>

</div>


<p id="movieDescription">

    Loading Description...

</p>


<!-- ========================================
     MIDDLE AD
======================================== -->

<div class="middle-ad">

    Middle Advertisement

</div>


<!-- ========================================
        SCREENSHOT GALLERY
======================================== -->

<div class="screenshots-section">

    <h2>
        📸 Screenshots
    </h2>

    <div class="screenshots-grid">

        <img id="screenshot1"
            src=""
            alt="Screenshot 1">

        <img id="screenshot2"
            src=""
            alt="Screenshot 2">

        <img id="screenshot3"
            src=""
            alt="Screenshot 3">

    </div>

</div>


<!-- ========================================
        SCREENSHOT 4 BACKGROUND SECTION
======================================== -->

<section class="screenshot4-background-section">

    <!-- Background Screenshot 4 -->
    <div class="screenshot4-background">

        <img
            id="screenshot4"
            src=""
            alt="Background Screenshot"
        >

    </div>

</section>

<!-- ========================================
     DOWNLOAD MOVIE
======================================== -->

<div class="movie-download-section">

    <h2>
        ⬇ Download Movie
    </h2>

    <p>
        Download this movie in high quality.
    </p>

    <button
        id="downloadButton"
        class="download-btn"
    >
        ⬇ Download Movie
    </button>

</div>


<!-- ========================================
     BOTTOM AD
======================================== -->

<div class="bottom-ad">

    Bottom Advertisement

</div>


<!-- ========================================
     RELATED MOVIES
======================================== -->

<div class="related-movies-section">

    <h2>
        🎬 Related Movies
    </h2>

    <div
        id="relatedMoviesGrid"
        class="related-movies-grid"
    >

        <!-- movie.js automatically load -->

    </div>

</div>

<script type="module" src="movie.js"></script>

</body>

</html>
