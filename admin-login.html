<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Crazymovie Admin Login</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: "Poppins", sans-serif;

    background: #0f0f0f;

    color: white;

}


.login-container {

    width: 90%;

    max-width: 420px;

    background: #181818;

    padding: 35px;

    border-radius: 15px;

    border:
    1px solid
    rgba(255,255,255,0.1);

    box-shadow:
    0 10px 40px
    rgba(0,0,0,0.5);

}


.logo {

    text-align: center;

    font-size: 28px;

    font-weight: 600;

    margin-bottom: 5px;

}


.subtitle {

    text-align: center;

    color: #888;

    margin-bottom: 30px;

}


.input-group {

    margin-bottom: 20px;

}


.input-group label {

    display: block;

    margin-bottom: 8px;

    color: #bbb;

}


.input-group input {

    width: 100%;

    padding: 13px 15px;

    border-radius: 8px;

    border:
    1px solid
    rgba(255,255,255,0.15);

    background: #101010;

    color: white;

    outline: none;

    font-size: 15px;

}


.input-group input:focus {

    border-color: #777;

}


.login-button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.3s;

}


.login-button:hover {

    opacity: 0.8;

}


.login-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


.error-message {

    display: none;

    margin-top: 15px;

    padding: 10px;

    border-radius: 8px;

    background: rgba(255,0,0,0.1);

    color: #ff6b6b;

    text-align: center;

    font-size: 14px;

}


.back-home {

    display: block;

    margin-top: 20px;

    text-align: center;

    color: #888;

    text-decoration: none;

    font-size: 14px;

}


.back-home:hover {

    color: white;

}

</style>

</head>

<body>

<div class="login-container">

<div class="logo">

```
🎬 Crazymovie
```

</div>

<div class="subtitle">

```
Admin Dashboard Login
```

</div>

<form id="loginForm">

<div class="input-group">

```
<label>
    Admin Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter admin email"
    autocomplete="username"
    required
>
```

</div>

<div class="input-group">

```
<label>
    Password
</label>

<input
    type="password"
    id="password"
    placeholder="Enter password"
    autocomplete="current-password"
    required
>
```

</div>

<button
type="submit"
class="login-button"
id="loginButton"

>

```
🔐 Login
```

</button>

</form>

<div
    class="error-message"
    id="errorMessage"
>

```
❌ Invalid email or password
```

</div>

<a
href="index.html"
class="back-home"

>

```
← Back to Home
```

</a>

</div>

<!-- ========================================
     FIREBASE AUTHENTICATION
======================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


// ========================================
// FIREBASE CONFIG
// ========================================

const firebaseConfig = {

    apiKey:
    "AIzaSyC3Xo0G-Vs2ldLqUO54n7FBSdWlPPdoxsc",

    authDomain:
    "crazymovie-4a2ae.firebaseapp.com",

    projectId:
    "crazymovie-4a2ae",

    storageBucket:
    "crazymovie-4a2ae.firebasestorage.app",

    messagingSenderId:
    "1025439382279",

    appId:
    "1:1025439382279:web:2380f84d57e302bed023a2"

};


// ========================================
// INITIALIZE FIREBASE
// ========================================

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


// ========================================
// LOGIN FORM
// ========================================

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // ========================================
        // GET FORM DATA
        // ========================================

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;


        // ========================================
        // HIDE OLD ERROR
        // ========================================

        errorMessage.style.display =
            "none";


        // ========================================
        // LOADING
        // ========================================

        loginButton.disabled =
            true;

        loginButton.innerText =
            "🔄 Logging in...";


        try {


            // ========================================
            // FIREBASE LOGIN
            // ========================================

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            // ========================================
            // CREATE ADMIN SESSION
            // ========================================

            sessionStorage.setItem(
                "crazymovieAdminLoggedIn",
                "true"
            );


            // ========================================
            // OPEN ADMIN DASHBOARD
            // ========================================

            window.location.href =
                "admin.html";


        } catch (error) {


            console.error(
                "Firebase Login Error:",
                error
            );


            // ========================================
            // SHOW ERROR
            // ========================================

            errorMessage.style.display =
                "block";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                errorMessage.innerText =
                    "❌ Invalid email or password.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                errorMessage.innerText =
                    "❌ Please enter a valid email.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                errorMessage.innerText =
                    "❌ Too many attempts. Please try again later.";

            }

            else {

                errorMessage.innerText =
                    "❌ Login failed. Please check your email and password.";

            }


            // ========================================
            // RESET BUTTON
            // ========================================

            loginButton.disabled =
                false;

            loginButton.innerText =
                "🔐 Login";

        }

    }

);

</script>

</body>

</html>
